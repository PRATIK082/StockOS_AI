[project]
name = "stock-market-backend"
version = "0.1.0"
description = "Local AI Stock Market Intelligence Platform — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "beautifulsoup4>=4.12",
    "scipy>=1.18.0",
    "numpy>=2.5.1",
    "feedparser>=6.0.14",
    "python-dateutil>=2.9.0.post0",
    "aiohttp>=3.14.3",
    "tradingagents",
    "argon2-cffi>=25.1.0",
    "slowapi>=0.1.10",
    "pyotp>=2.10.0",
    "duckdb>=2.0.0",
]

[project.scripts]
stockos = "app.cli:main"

[tool.uv.sources]
tradingagents = { path = "vendor/tradingagents", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
